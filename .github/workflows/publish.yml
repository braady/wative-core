# Publishes wative-core to npm via Trusted Publishing (OIDC) — no NPM_TOKEN.
# The Trusted Publisher on npmjs.com is bound to this repo + this exact filename
# (publish.yml) and allows direct `npm publish`, so a successful run publishes the
# version with no staging or 2FA approval step; npm's publish-time scan makes it
# installable a few minutes later. With that allowance off (stage-only), npm
# rejects the final step with 403 "OIDC permission denied for this action".
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required: lets the job mint the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest # must be GitHub-hosted; self-hosted is unsupported
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      # No build step and no NODE_AUTH_TOKEN: the checked-out dist/ is already the
      # published output, and a token would force the legacy path and bypass OIDC.
      - run: npm publish
